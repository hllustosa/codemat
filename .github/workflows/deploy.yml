name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install

      - name: Build content & functions
        run: npm run build:deploy

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Web deploys via Firebase App Hosting GitHub integration (backend: codemat).
      - name: Deploy Firebase Functions, rules & storage
        run: |
          npx firebase-tools@14.9.0 deploy \
            --only functions,firestore:rules,storage \
            --project codematbr \
            --non-interactive \
            --force
