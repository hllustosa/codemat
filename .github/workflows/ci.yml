name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm install

      - name: Build content
        run: npm run build:content

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://codematbr.web.app
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: codematbr
          NEXT_PUBLIC_API_BASE_URL: https://us-central1-codematbr.cloudfunctions.net/api
