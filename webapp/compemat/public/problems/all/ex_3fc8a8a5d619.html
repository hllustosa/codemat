<article style="color: #313b61; font-family: sans-serif; font-size: 16px">
  Neste problema você deve produzir um programa que receba como entrada dois
  números inteiros e produza como saída o produto desses dois números.

  <h3>Entradas</h3>
  Dois números <b>x</b> e <b>y</b> </p>

  <h3>Saída</h3>
  Um número <b>r</b> contendo o produto de <b>x</b> e <b>y</b> </p>

  <h3>Exemplo</h3>
  &nbsp; &nbsp; <b>Entrada:</b> <br/>
  &nbsp; &nbsp; &nbsp; &nbsp;<b>x</b>=10 <br/> 
  &nbsp; &nbsp; &nbsp; &nbsp;<b>y</b>=12 <br/><br/>  
  &nbsp; &nbsp; <b>Saída:</b> <br/> 
  &nbsp; &nbsp; &nbsp; &nbsp;120 
</article>
