# Firebase App Hosting — npm workspaces monorepo (apps/web + apps/functions).
#
# Required pattern (do not break):
# - firebase.json rootDir: "/" (lock file lives at repo root)
# - GOOGLE_BUILDABLE=apps/web (Next.js app location)
# - apphosting:build in package.json (never buildCommand in this file — strips workspaces)
# - runCommand below points at the monorepo standalone server.js path
#
# Backend id: "codemat" (must match firebase.json → apphosting[].backendId).
runConfig:
  cpu: 1
  memoryMiB: 1024
  runtime: nodejs20

env:
  - variable: GOOGLE_BUILDABLE
    value: apps/web
    availability:
      - BUILD
      - RUNTIME
  - variable: HOSTNAME
    value: "0.0.0.0"
    availability:
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://codematbr.web.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_BASE_URL
    value: https://us-central1-codematbr.cloudfunctions.net/api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB56b1j_L-IOVxIWPZavWN3h6qgJ9BT554
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: codematbr.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: codematbr
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: codematbr.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "10308488143"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:10308488143:web:bc976e03f50efd5671a0ba
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-RW2STXN3PG
    availability:
      - BUILD
      - RUNTIME

# Do NOT set buildCommand here — it rewrites package.json and strips npm workspaces.
# Use apphosting:build in package.json. Let the Next.js adapter set runCommand in bundle.yaml.
scripts:
  runCommand: node apps/web/.next/standalone/apps/web/server.js
